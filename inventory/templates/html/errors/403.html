{% extends 'html/base.html' %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="container-xxl flex-grow-1 container-p-y">
    <div class="card border-0 shadow-sm">
      <div class="card-body text-center py-5">
        <div class="display-5 fw-bold mb-2 text-danger">403</div>
        <h4 class="mb-2">You don’t have permission to view this page</h4>
        <p class="text-muted mb-4">Please check with an administrator if you believe this is an error.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
