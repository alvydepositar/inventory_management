{% load static %}
<!DOCTYPE html>
<html lang="en" class="light-style customizer-hide" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <link rel="icon" type="image/x-icon" href="{% static 'assets/img/favicon/favicon.ico' %}" />
    <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/core.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/theme-default.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}" />
    <link rel="stylesheet" href="{% static 'assets/vendor/css/pages/page-auth.css' %}" />
  </head>
  <body>
    <div class="container-xxl">
      <div class="authentication-wrapper authentication-basic container-p-y">
        <div class="authentication-inner py-4">
          <div class="card">
            <div class="card-body">
              <h5 class="mb-1 pt-2">Forgot your password?</h5>
              <p class="mb-4">Enter your account email and we will send a secure reset link.</p>

              <form method="post" class="mb-3">
                {% csrf_token %}
                <div class="mb-3">
                  <label for="id_email" class="form-label">Email</label>
                  <input
                    type="email"
                    name="email"
                    id="id_email"
                    class="form-control{% if form.email.errors %} is-invalid{% endif %}"
                    value="{{ form.email.value|default:'' }}"
                    required
                  />
                  {% if form.email.errors %}
                  <div class="invalid-feedback d-block">{{ form.email.errors|join:', ' }}</div>
                  {% endif %}
                </div>
                <button class="btn btn-primary d-grid w-100" type="submit">Send reset link</button>
              </form>

              <div class="text-center">
                <a href="{% url 'auth_login' %}">Back to sign in</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
