{% load static %}
<!DOCTYPE html>

<html
  lang="en"
  class="light-style layout-navbar-fixed layout-menu-fixed"
  dir="ltr"
  data-theme="theme-default"
  data-assets-path="{% static 'assets/' %}"
  data-template="vertical-menu-template"
>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"/>
  <title>{% block title %}Page Title{% endblock %}</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="{% static 'assets/img/logo.png' %}"/>

  <!-- Fonts and CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/fonts/fontawesome.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/fonts/tabler-icons.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/core.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/css/rtl/theme-default.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/css/demo.css' %}"/>
  <!-- Canary theme overrides -->
  <link rel="stylesheet" href="{% static 'assets/css/theme-canary.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/node-waves/node-waves.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/typeahead-js/typeahead.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/datatables-bs5/datatables.bootstrap5.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/datatables-responsive-bs5/responsive.bootstrap5.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/datatables-checkboxes-jquery/datatables.checkboxes.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/datatables-buttons-bs5/buttons.bootstrap5.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/flatpickr/flatpickr.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/datatables-rowgroup-bs5/rowgroup.bootstrap5.css' %}"/>
  <link rel="stylesheet" href="{% static 'assets/vendor/libs/formvalidation/dist/css/formValidation.min.css' %}"/>

  <!-- Helpers -->
  <script src="{% static 'assets/vendor/js/helpers.js' %}"></script>
  <script src="{% static 'assets/js/config.js' %}"></script>

</head>
<body>
  <!-- Layout wrapper -->
  <div class="layout-wrapper layout-content-navbar">
    <div class="layout-container">

      <!-- Sidebar: Place in separate file -->
      {% include 'html/partials/sidebar.html' %}

      <!-- Content wrapper --> 
      <div class="layout-page">
        <!-- Content Section -->
        {% block content %}
        {% endblock %}
      </div>

    </div>

    <!-- Overlay and other UI elements -->
    <div class="layout-overlay layout-menu-toggle"></div>
    <div class="drag-target"></div>
  </div>

  <!-- Core JS -->
  <script src="{% static 'assets/vendor/libs/jquery/jquery.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/popper/popper.js' %}"></script>
  <script src="{% static 'assets/vendor/js/bootstrap.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/perfect-scrollbar/perfect-scrollbar.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/node-waves/node-waves.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/hammer/hammer.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/i18n/i18n.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/typeahead-js/typeahead.js' %}"></script>

  <script src="{% static 'assets/vendor/js/menu.js' %}"></script>

  <script src="{% static 'assets/vendor/libs/datatables/jquery.dataTables.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-bs5/datatables-bootstrap5.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-responsive/datatables.responsive.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-responsive-bs5/responsive.bootstrap5.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-checkboxes-jquery/datatables.checkboxes.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-buttons/datatables-buttons.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-buttons-bs5/buttons.bootstrap5.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/jszip/jszip.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/pdfmake/pdfmake.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-buttons/buttons.html5.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-buttons/buttons.print.js' %}"></script>

  <script src="{% static 'assets/vendor/libs/moment/moment.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/flatpickr/flatpickr.js' %}"></script>

  <script src="{% static 'assets/vendor/libs/datatables-rowgroup/datatables.rowgroup.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/datatables-rowgroup-bs5/rowgroup.bootstrap5.js' %}"></script>

  <script src="{% static 'assets/vendor/libs/formvalidation/dist/js/FormValidation.min.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/formvalidation/dist/js/plugins/Bootstrap5.min.js' %}"></script>
  <script src="{% static 'assets/vendor/libs/formvalidation/dist/js/plugins/AutoFocus.min.js' %}"></script>

  <script src="{% static 'assets/js/main.js' %}"></script>

  <script src="{% static 'assets/js/tables.js' %}"></script>
</body>
</html>
