{% extends 'html/base.html' %}

{% block title %}Product Catalog{% endblock %}

{% block content %}
<!-- Content wrapper -->
<div class="content-wrapper">
  <!-- Content -->
  <div class="container-xxl flex-grow-1 container-p-y">
    <!-- DataTable with Buttons -->
    <div class="card">
      <div class="card-datatable table-responsive pt-0">
        <table class="product-datatables-basic table">
          <thead>
            <tr>
              <th></th>
              <th></th>
              <th>ID</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Brand</th>
              <th>Unit Price</th>
              <th>Supplier</th>
              <th>Actions</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>

  <!-- Modal to add new record -->
      <div class="modal fade" id="addProductModal" tabindex="-1" aria-labelledby="addProductModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="addProductModalLabel">Add New Product</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              </div>
              <div class="modal-body">
                <form id="addProductForm" class="row g-3 fv-plugins-bootstrap5 fv-plugins-framework" method="POST" action="{% url 'add_product' %}">
                  {% csrf_token %}
                  <div class="col-12 col-md-6 fv-plugins-icon-container">
                    <label class="form-label" for="modalProductID">Product ID</label>
                    <input type="text" id="modalProductID" name="product_id" class="form-control" placeholder="PRD-001">
                    <div class="fv-plugins-message-container invalid-feedback"></div>
                  </div>
                  <div class="col-12 col-md-6 fv-plugins-icon-container">
                    <label class="form-label" for="modalProductName">Product Name</label>
                    <input type="text" id="modalProductName" name="product_name" class="form-control" placeholder="Product Name">
                    <div class="fv-plugins-message-container invalid-feedback"></div>
                  </div>
                  <div class="col-12 col-md-6 fv-plugins-icon-container">
                    <label class="form-label" for="modalCategory">Category</label>
                    <input type="text" id="modalCategory" name="category" class="form-control" placeholder="Category">
                    <div class="fv-plugins-message-container invalid-feedback"></div>
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="modalBrand">Brand</label>
                    <input type="text" id="modalBrand" name="brand" class="form-control" placeholder="Brand">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="modalUnitPrice">Unit Price</label>
                    <input type="number" id="modalUnitPrice" name="unit_price" class="form-control" placeholder="0.00">
                  </div>
                  <div class="col-12 col-md-6">
                    <label class="form-label" for="modalSupplier">Supplier</label>
                    <input type="text" id="modalSupplier" name="supplier" class="form-control" placeholder="Supplier Name">
                  </div>
                  <div class="col-12 text-center">
                    <button type="submit" class="btn btn-primary me-sm-3 me-1 waves-effect waves-light">Submit</button>
                    <button type="reset" class="btn btn-label-secondary waves-effect" data-bs-dismiss="modal" aria-label="Close">
                      Cancel
                    </button>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
    <!-- Modal to add new record -->
  
    <!--/ DataTable with Buttons -->  
  </div>
</div>
{% endblock %}
