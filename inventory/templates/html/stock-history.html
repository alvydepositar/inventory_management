{% extends 'html/base.html' %}

{% block title %}Transaction Log{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="container-xxl flex-grow-1 container-p-y">
    {% if branch %}
    <script>window.currentBranchId={{ branch.id }};</script>
    {% else %}
    <script>window.currentBranchId=null;</script>
    {% endif %}

    <div class="d-flex align-items-center justify-content-between mb-3">
      <h4 class="fw-bold m-0">Transaction Log</h4>
    </div>

    <div class="card table-blend-shell mb-3 p-3">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-3">
          <label class="form-label" for="mvBranch">Branch</label>
          <select id="mvBranch" class="form-select">
            <option value="">All Branches</option>
            {% for b in branches %}
              <option value="{{ b.id }}" {% if branch and branch.id == b.id %}selected{% endif %}>{{ b.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label" for="mvProduct">Product</label>
          <select id="mvProduct" class="form-select">
            <option value="">All Products</option>
            {% for p in products %}
              <option value="{{ p.id }}" {% if selected_product_id == p.id %}selected{% endif %}>{{ p.product_name }} ({{ p.brand.name }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="mvType">Action</label>
          <select id="mvType" class="form-select">
            <option value="">All Actions</option>
            <option value="IN" {% if selected_txn_type == 'IN' %}selected{% endif %}>Receive Stock</option>
            <option value="OUT" {% if selected_txn_type == 'OUT' %}selected{% endif %}>Release Stock</option>
            <option value="BACKLOAD" {% if selected_txn_type == 'BACKLOAD' %}selected{% endif %}>Transfer to Branch</option>
            <option value="MIXING" {% if selected_txn_type == 'MIXING' %}selected{% endif %}>Mix / Convert</option>
            <option value="MIX_OUT" {% if selected_txn_type == 'MIX_OUT' %}selected{% endif %}>Used for Mixing</option>
            <option value="MIX_IN" {% if selected_txn_type == 'MIX_IN' %}selected{% endif %}>Produced from Mixing</option>
          </select>
        </div>
        <div class="col-12 col-md-4">
          <label class="form-label" for="mvDateRange">Date Range</label>
          <input
            id="mvDateRange"
            class="form-control"
            placeholder="Select date range"
            value="{% if selected_date_from and selected_date_to %}{{ selected_date_from }} to {{ selected_date_to }}{% elif selected_date_from %}{{ selected_date_from }}{% elif selected_date_to %}{{ selected_date_to }}{% endif %}"
          />
        </div>
      </div>
    </div>

    <div class="card table-blend-shell">
      <div class="card-datatable table-responsive pt-0">
        <table class="movement-datatables-basic table">
          <thead>
            <tr>
              <th></th>
              <th>Date</th>
              <th>Txn ID</th>
              <th>Branch / Transfer Route</th>
              <th>Product</th>
              <th>Before</th>
              <th>Action</th>
              <th>Ending Balance</th>
              <th>Handled By</th>
              <th>Remarks</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
