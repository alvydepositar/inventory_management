{% extends 'html/base.html' %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="container-xxl flex-grow-1 container-p-y">
    <div class="card border-0 shadow-sm">
      <div class="card-body text-center py-5">
        <div class="display-5 fw-bold mb-2 text-warning">500</div>
        <h4 class="mb-2">Something went wrong</h4>
        <p class="text-muted mb-4">An unexpected error occurred. Our team has been notified.</p>
        <a href="{% url 'dashboard' %}" class="btn btn-primary">Return to Dashboard</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
