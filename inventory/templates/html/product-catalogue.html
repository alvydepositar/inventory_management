{% extends 'html/base.html' %}

{% block title %}Product Catalog{% endblock %}

{% block content %}
<!-- Content wrapper -->
<div class="content-wrapper">
  <!-- Content -->
  <div class="container-xxl flex-grow-1 container-p-y">
    <!-- DataTable with Buttons -->
    <div class="card">
      <div class="card-datatable table-responsive pt-0">
        <table class="product-datatables-basic table">
          <thead>
            <tr>
              <th></th>
              <th></th>
              <th>ID</th>
              <th>Product Name</th>
              <th>Category</th>
              <th>Brand</th>
              <th>Unit Price</th>
              <th>Supplier</th>
              <th>Actions</th>
            </tr>
          </thead>
        </table>
      </div>
    </div>

    <div class="modal fade" id="add-new-record" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-simple modal-edit-user">
        <div class="modal-content p-3 p-md-5">
          <div class="modal-body">
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            <div class="text-center mb-4">
              <h3 class="mb-2">Add New Product</h3>
              <p class="text-muted">Adding new product to the catalog.</p>
            </div>
            <form id="addProductForm" class="row g-3 fv-plugins-bootstrap5 fv-plugins-framework" onsubmit="return false" novalidate="novalidate">
              <div class="col-12 col-md-6 fv-plugins-icon-container">
                <label class="form-label" for="modalProductID">Product ID</label>
                <input type="text" id="modalProductID" name="modalProductID" class="form-control" placeholder="PRD-001">
                <div class="fv-plugins-message-container invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-6 fv-plugins-icon-container">
                <label class="form-label" for="modalProductName">Product Name</label>
                <input type="text" id="modalProductName" name="modalProductName" class="form-control" placeholder="Product Name">
                <div class="fv-plugins-message-container invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-6 fv-plugins-icon-container">
                <label class="form-label" for="modalCategory">Category</label>
                <input type="text" id="modalCategory" name="modalCategory" class="form-control" placeholder="Category">
                <div class="fv-plugins-message-container invalid-feedback"></div>
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="modalBrand">Brand</label>
                <input type="text" id="modalBrand" name="modalBrand" class="form-control" placeholder="Brand">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="modalUnitPrice">Unit Price</label>
                <input type="number" id="modalUnitPrice" name="modalUnitPrice" class="form-control" placeholder="0.00">
              </div>
              <div class="col-12 col-md-6">
                <label class="form-label" for="modalSupplier">Supplier</label>
                <input type="text" id="modalSupplier" name="modalSupplier" class="form-control" placeholder="Supplier Name">
              </div>
              <div class="col-12 text-center">
                <button type="submit" class="btn btn-primary me-sm-3 me-1 waves-effect waves-light">Submit</button>
                <button type="reset" class="btn btn-label-secondary waves-effect" data-bs-dismiss="modal" aria-label="Close">
                  Cancel
                </button>
              </div>
              <input type="hidden">
            </form>
          </div>
        </div>
      </div>
    </div>
    <!-- Modal to add new record -->
  
    <!--/ DataTable with Buttons -->  
  </div>
</div>
{% endblock %}
