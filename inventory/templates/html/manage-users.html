{% extends 'html/base.html' %}

{% block title %}Manage Users{% endblock %}

{% block content %}
<!-- Content wrapper -->
<div class="content-wrapper">
    <!-- Content -->
    <div class="container-xxl flex-grow-1 container-p-y">    <!-- Your tables content here -->
      <!-- DataTable with Buttons -->
      <div class="card">
        <div class="card-datatable table-responsive pt-0">
          <table class="users-datatables-basic table">
            <thead>
              <tr>
                <th></th> <!-- For the control column -->
                <th></th> <!-- For the checkbox column -->
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Name</th>
                <th>Role</th>
                <th>Status</th>
                <th>Branch</th>
                <th>Actions</th>
              </tr>
            </thead>
          </table>
        </div>
      </div>

      <!-- Modal to add/edit record -->
      <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
          <div class="modal-dialog modal-lg">
              <div class="modal-content">
                  <div class="modal-header">
                      <h5 class="modal-title" id="userModalLabel">{{ modal_title }}</h5>
                      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                  </div>
                  <div class="modal-body">
                      <form id="userForm" class="row g-3 fv-plugins-bootstrap5 fv-plugins-framework" method="POST" action="{% url 'add_user' %}">
                          {% csrf_token %}
                          {% if editing %}
                              <input type="hidden" name="user_id" value="{{ user.id }}">
                          {% endif %}
                            <div class="col-12 col-md-6">
                              <label class="form-label" for="userFirstName">First Name</label>
                              <input type="text" id="userFirstName" name="first_name" class="form-control" placeholder="First Name" value="{% if editing %}{{ user.first_name }}{% endif %}">
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                            </div>
                            <div class="col-12 col-md-6">
                              <label class="form-label" for="userLastName">Last Name</label>
                              <input type="text" id="userLastName" name="last_name" class="form-control" placeholder="Last Name" value="{% if editing %}{{ user.last_name }}{% endif %}">
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                            </div>
                          <div class="col-12 col-md-4">
                              <label class="form-label" for="userName">User Name</label>
                              <input type="text" id="userName" name="username" class="form-control" placeholder="User Name" value="{% if editing %}{{ user.username }}{% endif %}">
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                          </div>
                          <div class="col-12 col-md-4">
                              <label class="form-label" for="userEmail">Email</label>
                              <input type="email" id="userEmail" name="email" class="form-control" placeholder="Email" value="{% if editing %}{{ user.email }}{% endif %}">
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                          </div>
                          <div class="col-12 col-md-4">
                              <label class="form-label" for="userPassword">Password</label>
                              <input type="password" id="userPassword" name="password" class="form-control" placeholder="Password">
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                          </div>
                          <div class="col-12 col-md-4 d-flex align-items-center">
                              <div class="form-check mt-3">
                                  <input class="form-check-input" type="checkbox" value="true" id="userActive" name="is_active" checked>
                                  <label class="form-check-label" for="userActive">
                                      Active
                                  </label>
                              </div>
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                          </div>
                          <div class="col-12 col-md-4">
                              <label class="form-label" for="userRole">Role</label>
                              <select id="userRole" name="user_role" class="form-select">
                                  <option value="admin" {% if editing and user.user_role == 'admin' %}selected{% endif %}>Admin</option>
                                  <option value="stock_manager" {% if editing and user.user_role == 'stock_manager' %}selected{% endif %}>Stock Manager</option>
                                  <option value="branch_manager" {% if editing and user.user_role == 'branch_manager' %}selected{% endif %}>Branch Manager</option>
                              </select>
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                          </div>
                          <div class="col-12 col-md-8">
                              <label class="form-label" for="userBranch">Assigned Branch (for Branch Managers)</label>
                              <select id="userBranch" name="assigned_branch" class="form-select">
                                  <option value="">No branch assigned</option>
                                  {% for b in branches %}
                                    <option value="{{ b.id }}" {% if editing and user.assigned_branch and user.assigned_branch.id == b.id %}selected{% endif %}>{{ b.name }}</option>
                                  {% endfor %}
                              </select>
                              <div class="fv-plugins-message-container invalid-feedback"></div>
                          </div>
                          <div class="col-12 text-center">
                              <button type="submit" id="addUserBtn" class="btn btn-primary me-sm-3 me-1 waves-effect waves-light">Submit</button>
                              <button type="button" class="btn btn-label-secondary waves-effect" data-bs-dismiss="modal" aria-label="Close">
                                  Cancel
                              </button>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
      <!-- Modal to add new record -->
    
      <!--/ DataTable with Buttons -->  
    </div>
  </div>
{% endblock %}
