{% extends 'html/base.html' %}

{% block title %}My Account{% endblock %}

{% block content %}
<div class="content-wrapper">
  <div class="container-xxl flex-grow-1 container-p-y">
    <h4 class="fw-bold mb-4">My Account</h4>
    <div class="row">
      <div class="col-12 col-lg-6">
        <div class="card mb-4">
          <div class="card-header">Profile</div>
          <div class="card-body">
            <form id="accountProfileForm">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Username</label>
                <input class="form-control" value="{{ dj_user.username }}" disabled>
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input class="form-control" name="email" value="{{ dj_user.email }}">
              </div>
              <div class="mb-3">
                <label class="form-label">First name</label>
                <input class="form-control" name="first_name" value="{{ dj_user.first_name }}">
              </div>
              <div class="mb-3">
                <label class="form-label">Last name</label>
                <input class="form-control" name="last_name" value="{{ dj_user.last_name }}">
              </div>
              <button class="btn btn-primary" type="submit">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6">
        <div class="card mb-4">
          <div class="card-header">Change Password</div>
          <div class="card-body">
            <form id="accountPasswordForm">
              {% csrf_token %}
              <div class="mb-3">
                <label class="form-label">Current password</label>
                <input class="form-control" type="password" name="current_password">
              </div>
              <div class="mb-3">
                <label class="form-label">New password</label>
                <input class="form-control" type="password" name="new_password">
              </div>
              <div class="mb-3">
                <label class="form-label">Confirm new password</label>
                <input class="form-control" type="password" name="confirm_password">
              </div>
              <button class="btn btn-primary" type="submit">Change Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function(){
    const profForm = document.getElementById('accountProfileForm');
    if (profForm) {
      profForm.addEventListener('submit', function(e){
        e.preventDefault();
        const fd = new FormData(profForm);
        fetch('/account/update/', { method: 'POST', body: fd, headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value }})
          .then(r => r.json())
          .then(d => { alert(d.message || (d.success ? 'Saved' : 'Failed')); if(!d.success){ console.error(d) } });
      });
    }
    const passForm = document.getElementById('accountPasswordForm');
    if (passForm) {
      passForm.addEventListener('submit', function(e){
        e.preventDefault();
        const fd = new FormData(passForm);
        fetch('/account/change-password/', { method: 'POST', body: fd, headers: { 'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value }})
          .then(r => r.json())
          .then(d => { alert(d.message || (d.success ? 'Changed' : 'Failed')); if(d.success){ window.location.href='/logout/'; }});
      });
    }
  })();
</script>
{% endblock %}
