{% extends 'html/base.html' %}

{% block title %}Manage Users{% endblock %}

{% block content %}
<!-- Content wrapper -->
<div class="content-wrapper">
    <!-- Content -->
    <div class="container-xxl flex-grow-1 container-p-y">    <!-- Your tables content here -->
      <!-- DataTable with Buttons -->
      <div class="card">
        <div class="card-datatable table-responsive pt-0">
          <table class="datatables-basic table">
            <thead>
              <tr>
                <th></th> <!-- For the control column -->
                <th>ID</th>
                <th>ID</th>
                <th>User Name</th>
                <th>Role</th>
                <th>Email</th>
                <th>Supplier</th>
              </tr>
            </thead>
          </table>
        </div>
      </div>
      <div class="modal fade show" tabindex="-1" style="display: none;" aria-modal="true" role="dialog" id="add-new-record">
        <div class="modal-dialog modal-lg modal-simple modal-edit-user">
          <div class="modal-content p-3 p-md-5">
            <div class="modal-body">
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
              <div class="text-center mb-4">
                <h3 class="mb-2">Edit User Information</h3>
                <p class="text-muted">Updating user details will receive a privacy audit.</p>
              </div>
              <form id="editUserForm" class="row g-3 fv-plugins-bootstrap5 fv-plugins-framework" onsubmit="return false" novalidate="novalidate">
                <div class="col-12 col-md-6 fv-plugins-icon-container">
                  <label class="form-label" for="modalEditUserFirstName">First Name</label>
                  <input type="text" id="modalEditUserFirstName" name="modalEditUserFirstName" class="form-control" placeholder="John">
                <div class="fv-plugins-message-container invalid-feedback"></div></div>
                <div class="col-12 col-md-6 fv-plugins-icon-container">
                  <label class="form-label" for="modalEditUserLastName">Last Name</label>
                  <input type="text" id="modalEditUserLastName" name="modalEditUserLastName" class="form-control" placeholder="Doe">
                <div class="fv-plugins-message-container invalid-feedback"></div></div>
                <div class="col-12 fv-plugins-icon-container">
                  <label class="form-label" for="modalEditUserName">Username</label>
                  <input type="text" id="modalEditUserName" name="modalEditUserName" class="form-control" placeholder="john.doe.007">
                <div class="fv-plugins-message-container invalid-feedback"></div></div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="modalEditUserEmail">Email</label>
                  <input type="text" id="modalEditUserEmail" name="modalEditUserEmail" class="form-control" placeholder="example@domain.com">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="modalEditUserStatus">Status</label>
                  <select id="modalEditUserStatus" name="modalEditUserStatus" class="form-select" aria-label="Default select example">
                    <option selected="">Status</option>
                    <option value="1">Active</option>
                    <option value="2">Inactive</option>
                    <option value="3">Suspended</option>
                  </select>
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="modalEditTaxID">Tax ID</label>
                  <input type="text" id="modalEditTaxID" name="modalEditTaxID" class="form-control modal-edit-tax-id" placeholder="123 456 7890">
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label" for="modalEditUserPhone">Phone Number</label>
                  <div class="input-group">
                    <span class="input-group-text">US (+1)</span>
                    <input type="text" id="modalEditUserPhone" name="modalEditUserPhone" class="form-control phone-number-mask" placeholder="202 555 0111">
                  </div>
                </div>
                <div class="col-12">
                  <label class="switch">
                    <input type="checkbox" class="switch-input">
                    <span class="switch-toggle-slider">
                      <span class="switch-on"></span>
                      <span class="switch-off"></span>
                    </span>
                    <span class="switch-label">Use as a billing address?</span>
                  </label>
                </div>
                <div class="col-12 text-center">
                  <button type="submit" class="btn btn-primary me-sm-3 me-1 waves-effect waves-light">Submit</button>
                  <button type="reset" class="btn btn-label-secondary waves-effect" data-bs-dismiss="modal" aria-label="Close">
                    Cancel
                  </button>
                </div>
              <input type="hidden"></form>
            </div>
          </div>
        </div>
      </div>
      <!-- Modal to add new record -->
    
      <!--/ DataTable with Buttons -->  
    </div>
  </div>
{% endblock %}
